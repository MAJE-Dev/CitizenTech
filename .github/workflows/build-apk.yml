name: Build APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release que vai receber o .apk (ex.: v6). Vazio = só compilar e guardar o APK como artifact, sem publicar."
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Conferir tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs=-Xmx4g --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SmartRoad-CitizenTech.apk

      - name: Guardar APK como artifact (não perde a compilação se o upload falhar)
        uses: actions/upload-artifact@v4
        with:
          name: SmartRoad-CitizenTech-apk
          path: app/SmartRoad-CitizenTech.apk

      - name: Anexar APK na release (cria a release se não existir)
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "APK do SmartRoad (CitizenTech)"
          gh release upload "$TAG" SmartRoad-CitizenTech.apk --clobber --repo "$GITHUB_REPOSITORY"
